<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERCEPTA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 10;
            display: none;
            transition: width 0.15s ease, height 0.15s ease,
                        background 0.15s ease, border 0.15s ease;
            border: 2px solid transparent;
            box-sizing: content-box;
        }

        #crosshair.hover {
            width: 12px;
            height: 12px;
        }

        #crosshair.holding {
            width: 14px;
            height: 14px;
            background: transparent;
            border-color: rgba(255, 255, 255, 0.8);
        }

        #instructions {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            z-index: 20;
            user-select: none;
        }

        #instructions h1 {
            font-size: 48px;
            letter-spacing: 12px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        #instructions p {
            font-size: 16px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="crosshair"></div>
    <div id="instructions">
        <h1>PERCEPTA</h1>
        <p>Haz click para jugar</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ============================================================
    //  PERCEPTA — Motor base + Perspectiva Forzada
    // ============================================================

    // ------------------------------------------------------------
    //  1. RENDERER, SCENE & CAMERA
    // ------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 1.7, 0);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('game-container').appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ------------------------------------------------------------
    //  2. CONTROLES FIRST PERSON (Pointer Lock + WASD)
    // ------------------------------------------------------------

    const MOUSE_SENSITIVITY = 0.002;
    const MOVE_SPEED = 5;
    const PLAYER_HEIGHT = 1.7;

    let yaw = 0;
    let pitch = 0;
    let isLocked = false;

    const keys = {};

    const instructions = document.getElementById('instructions');
    const crosshair = document.getElementById('crosshair');

    document.addEventListener('pointerlockchange', () => {
        isLocked = document.pointerLockElement === document.body;
        instructions.style.display = isLocked ? 'none' : 'block';
        crosshair.style.display = isLocked ? 'block' : 'none';

        // Iniciar audio en primera interacción
        if (isLocked && !audioEngine.started) {
            audioEngine.init();
            audioEngine.startDrone(1);
        }
        if (isLocked) audioEngine._resume();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isLocked) return;

        yaw -= e.movementX * MOUSE_SENSITIVITY;
        pitch -= e.movementY * MOUSE_SENSITIVITY;
        pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

        camera.quaternion.setFromEuler(
            new THREE.Euler(pitch, yaw, 0, 'YXZ')
        );
    });

    document.addEventListener('keydown', (e) => { keys[e.code] = true; });
    document.addEventListener('keyup',   (e) => { keys[e.code] = false; });

    // ------------------------------------------------------------
    //  3. HABITACIÓN DE PRUEBA (20 x 10 x 20)
    // ------------------------------------------------------------

    const ROOM_W = 20;
    const ROOM_H = 10;
    const ROOM_D = 20;

    const floorMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
    const wallMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM_W, ROOM_D),
        floorMat
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM_W, ROOM_D),
        wallMat
    );
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = ROOM_H;
    ceiling.receiveShadow = true;
    scene.add(ceiling);

    const wallBack = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM_W, ROOM_H),
        wallMat
    );
    wallBack.position.set(0, ROOM_H / 2, -ROOM_D / 2);
    wallBack.receiveShadow = true;
    scene.add(wallBack);

    const wallFront = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM_W, ROOM_H),
        wallMat
    );
    wallFront.position.set(0, ROOM_H / 2, ROOM_D / 2);
    wallFront.rotation.y = Math.PI;
    wallFront.receiveShadow = true;
    scene.add(wallFront);

    const wallLeft = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM_D, ROOM_H),
        wallMat
    );
    wallLeft.position.set(-ROOM_W / 2, ROOM_H / 2, 0);
    wallLeft.rotation.y = Math.PI / 2;
    wallLeft.receiveShadow = true;
    scene.add(wallLeft);

    const wallRight = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM_D, ROOM_H),
        wallMat
    );
    wallRight.position.set(ROOM_W / 2, ROOM_H / 2, 0);
    wallRight.rotation.y = -Math.PI / 2;
    wallRight.receiveShadow = true;
    scene.add(wallRight);

    const walls = [wallBack, wallFront, wallLeft, wallRight];

    // Superficies del nivel para drop raycasts (piso, techo, paredes)
    const levelSurfaces = [floor, ceiling, ...walls];

    // ------------------------------------------------------------
    //  4. ILUMINACIÓN
    // ------------------------------------------------------------

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 8, 3);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    scene.add(dirLight);

    const pointLight1 = new THREE.PointLight(0xffeedd, 0.3, 20);
    pointLight1.position.set(-6, 6, -6);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xddeeff, 0.3, 20);
    pointLight2.position.set(6, 6, 6);
    scene.add(pointLight2);

    // ------------------------------------------------------------
    //  5. AUDIO ENGINE (Web Audio API — Procedural)
    // ------------------------------------------------------------

    class AudioEngine {
        constructor() {
            this.ctx = null;
            this.master = null;
            this.started = false;
            this.reverbBuffer = null;
            this.droneOsc1 = null;
            this.droneOsc2 = null;
            this.droneGain = null;
            this.droneFilter = null;
            this.footstepTimer = 0;
            this.footstepSide = false; // alterna izq/der
        }

        // --- Inicialización (llamar en primera interacción) ---
        init() {
            if (this.started) return;
            const AC = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AC();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.8;
            this.master.connect(this.ctx.destination);
            this.reverbBuffer = this._createReverbIR(1.5, 0.6);
            this.started = true;
        }

        // --- Asegurar contexto activo ---
        _resume() {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        // --- Generar Impulse Response para reverb ---
        _createReverbIR(duration, decay) {
            const length = this.ctx.sampleRate * duration;
            const buffer = this.ctx.createBuffer(2, length, this.ctx.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const data = buffer.getChannelData(ch);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay * 3);
                }
            }
            return buffer;
        }

        // --- Crear nodo de reverb ---
        _createReverb(dryGain, wetGain) {
            const dry = this.ctx.createGain();
            dry.gain.value = dryGain;
            const wet = this.ctx.createGain();
            wet.gain.value = wetGain;
            const conv = this.ctx.createConvolver();
            conv.buffer = this.reverbBuffer;
            // Retornar un objeto para conectar
            return { dry, wet, conv, connect: (dest) => {
                dry.connect(dest);
                wet.connect(conv);
                conv.connect(dest);
            }};
        }

        // --- 2. Drone Ambiente ---
        startDrone(level = 1) {
            if (!this.started) return;
            this._resume();
            const t = this.ctx.currentTime;

            // Limpiar drone previo
            this.stopDrone();

            this.droneGain = this.ctx.createGain();
            this.droneGain.gain.setValueAtTime(0, t);
            this.droneGain.gain.linearRampToValueAtTime(0.08, t + 2);

            this.droneFilter = this.ctx.createBiquadFilter();
            this.droneFilter.type = 'lowpass';
            this.droneFilter.frequency.value = 200;
            this.droneFilter.Q.value = 1;

            // Oscilador 1: base grave
            const baseFreq = 60 + (level - 1) * 5;
            this.droneOsc1 = this.ctx.createOscillator();
            this.droneOsc1.type = 'sine';
            this.droneOsc1.frequency.value = baseFreq;

            // Oscilador 2: armónico superior
            this.droneOsc2 = this.ctx.createOscillator();
            this.droneOsc2.type = 'sine';
            this.droneOsc2.frequency.value = baseFreq * 1.5;
            const osc2Gain = this.ctx.createGain();
            osc2Gain.gain.value = 0.4;

            // Conectar
            this.droneOsc1.connect(this.droneFilter);
            this.droneOsc2.connect(osc2Gain);
            osc2Gain.connect(this.droneFilter);
            this.droneFilter.connect(this.droneGain);
            this.droneGain.connect(this.master);

            this.droneOsc1.start(t);
            this.droneOsc2.start(t);
        }

        stopDrone() {
            const t = this.ctx ? this.ctx.currentTime : 0;
            if (this.droneOsc1) {
                try { this.droneOsc1.stop(t + 0.1); } catch(e) {}
                this.droneOsc1 = null;
            }
            if (this.droneOsc2) {
                try { this.droneOsc2.stop(t + 0.1); } catch(e) {}
                this.droneOsc2 = null;
            }
        }

        // --- 3. Pasos ---
        _playFootstep() {
            if (!this.started) return;
            const t = this.ctx.currentTime;

            // Ruido blanco
            const bufLen = this.ctx.sampleRate * 0.15;
            const noiseBuf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
            const data = noiseBuf.getChannelData(0);
            for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

            const src = this.ctx.createBufferSource();
            src.buffer = noiseBuf;

            // Bandpass
            const bp = this.ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = this.footstepSide ? 1200 : 900;
            bp.Q.value = 1.5;

            // Envelope
            const env = this.ctx.createGain();
            env.gain.setValueAtTime(0, t);
            env.gain.linearRampToValueAtTime(0.15, t + 0.01);
            env.gain.linearRampToValueAtTime(0.08, t + 0.05);
            env.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

            // Reverb
            const rev = this._createReverb(0.7, 0.3);

            src.connect(bp);
            bp.connect(env);
            env.connect(rev.dry);
            env.connect(rev.wet);
            rev.connect(this.master);

            src.start(t);
            src.stop(t + 0.15);

            this.footstepSide = !this.footstepSide;
        }

        updateFootsteps(isMoving, dt) {
            if (!this.started) return;
            if (isMoving) {
                this.footstepTimer += dt;
                if (this.footstepTimer >= 0.5) {
                    this.footstepTimer -= 0.5;
                    this._playFootstep();
                }
            } else {
                this.footstepTimer = 0.3; // casi listo para sonar al empezar
            }
        }

        // --- 4. Pickup ---
        _playPickup() {
            if (!this.started) return;
            this._resume();
            const t = this.ctx.currentTime;

            // Click con ruido blanco
            const clickLen = this.ctx.sampleRate * 0.005;
            const clickBuf = this.ctx.createBuffer(1, clickLen, this.ctx.sampleRate);
            const cd = clickBuf.getChannelData(0);
            for (let i = 0; i < clickLen; i++) cd[i] = (Math.random() * 2 - 1) * (1 - i / clickLen);
            const clickSrc = this.ctx.createBufferSource();
            clickSrc.buffer = clickBuf;
            const clickGain = this.ctx.createGain();
            clickGain.gain.value = 0.1;
            clickSrc.connect(clickGain);
            clickGain.connect(this.master);
            clickSrc.start(t);

            // Sweep tonal ascendente
            const osc = this.ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, t);
            osc.frequency.exponentialRampToValueAtTime(600, t + 0.15);
            const env = this.ctx.createGain();
            env.gain.setValueAtTime(0, t);
            env.gain.linearRampToValueAtTime(0.12, t + 0.01);
            env.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            osc.connect(env);
            env.connect(this.master);
            osc.start(t);
            osc.stop(t + 0.25);
        }

        // --- 5. Drop ---
        _playDrop(objectScale) {
            if (!this.started) return;
            this._resume();
            const t = this.ctx.currentTime;

            // Mapear escala a pitch y volumen
            const s = Math.max(0.1, Math.min(objectScale, 20));
            const pitch = THREE.MathUtils.lerp(150, 40, Math.min(s / 5, 1));
            const vol = THREE.MathUtils.lerp(0.08, 0.25, Math.min(s / 5, 1));
            const reverbWet = THREE.MathUtils.lerp(0.1, 0.5, Math.min(s / 5, 1));

            // Thud grave
            const osc = this.ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(pitch, t);
            osc.frequency.exponentialRampToValueAtTime(pitch * 0.5, t + 0.2);
            const env = this.ctx.createGain();
            env.gain.setValueAtTime(vol, t);
            env.gain.exponentialRampToValueAtTime(0.001, t + 0.3);

            // Componente de ruido para impacto
            const noiseLen = this.ctx.sampleRate * 0.08;
            const noiseBuf = this.ctx.createBuffer(1, noiseLen, this.ctx.sampleRate);
            const nd = noiseBuf.getChannelData(0);
            for (let i = 0; i < noiseLen; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / noiseLen);
            const noiseSrc = this.ctx.createBufferSource();
            noiseSrc.buffer = noiseBuf;
            const noiseGain = this.ctx.createGain();
            noiseGain.gain.value = vol * 0.5;
            const noiseLp = this.ctx.createBiquadFilter();
            noiseLp.type = 'lowpass';
            noiseLp.frequency.value = pitch * 3;

            // Reverb
            const rev = this._createReverb(1 - reverbWet, reverbWet);

            osc.connect(env);
            env.connect(rev.dry);
            env.connect(rev.wet);
            rev.connect(this.master);
            osc.start(t);
            osc.stop(t + 0.35);

            noiseSrc.connect(noiseLp);
            noiseLp.connect(noiseGain);
            noiseGain.connect(this.master);
            noiseSrc.start(t);
        }

        // --- 6. Puzzle resuelto ---
        _playPuzzleSolved() {
            if (!this.started) return;
            this._resume();
            const t = this.ctx.currentTime;
            const notes = [261.63, 329.63, 392.00]; // C4, E4, G4
            const delays = [0, 0.1, 0.2];

            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const env = this.ctx.createGain();
                const start = t + delays[i];
                env.gain.setValueAtTime(0, start);
                env.gain.linearRampToValueAtTime(0.12, start + 0.1);
                env.gain.setValueAtTime(0.12, start + 0.6);
                env.gain.exponentialRampToValueAtTime(0.001, start + 1.6);

                const rev = this._createReverb(0.5, 0.5);
                osc.connect(env);
                env.connect(rev.dry);
                env.connect(rev.wet);
                rev.connect(this.master);
                osc.start(start);
                osc.stop(start + 1.7);
            });

            // Barrido ascendente sutil
            const sweep = this.ctx.createOscillator();
            sweep.type = 'sine';
            sweep.frequency.setValueAtTime(200, t);
            sweep.frequency.exponentialRampToValueAtTime(800, t + 1.5);
            const sweepEnv = this.ctx.createGain();
            sweepEnv.gain.setValueAtTime(0, t);
            sweepEnv.gain.linearRampToValueAtTime(0.03, t + 0.3);
            sweepEnv.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
            sweep.connect(sweepEnv);
            sweepEnv.connect(this.master);
            sweep.start(t);
            sweep.stop(t + 2);
        }

        // --- 7. Transición de nivel ---
        _playLevelTransition(nextLevel) {
            if (!this.started) return;
            this._resume();
            const t = this.ctx.currentTime;

            // Subir drone
            if (this.droneGain) {
                this.droneGain.gain.linearRampToValueAtTime(0.3, t + 1);
            }
            if (this.droneOsc1) {
                this.droneOsc1.frequency.linearRampToValueAtTime(120, t + 1);
            }

            // Distorsión creciente
            const shaper = this.ctx.createWaveShaper();
            const curve = new Float32Array(256);
            for (let i = 0; i < 256; i++) {
                const x = (i / 128) - 1;
                curve[i] = (Math.PI + 200) * x / (Math.PI + 200 * Math.abs(x));
            }
            shaper.curve = curve;

            // Ruido de transición con reverb larga
            const transLen = this.ctx.sampleRate * 1.5;
            const transBuf = this.ctx.createBuffer(1, transLen, this.ctx.sampleRate);
            const td = transBuf.getChannelData(0);
            for (let i = 0; i < transLen; i++) {
                td[i] = (Math.random() * 2 - 1) * Math.pow(i / transLen, 2) *
                         Math.pow(1 - i / transLen, 0.5);
            }
            const transSrc = this.ctx.createBufferSource();
            transSrc.buffer = transBuf;
            const transGain = this.ctx.createGain();
            transGain.gain.value = 0.15;

            // Reverb larga
            const longIR = this._createReverbIR(4, 0.3);
            const longConv = this.ctx.createConvolver();
            longConv.buffer = longIR;

            transSrc.connect(shaper);
            shaper.connect(transGain);
            transGain.connect(longConv);
            longConv.connect(this.master);
            transSrc.start(t);

            // Silencio abrupto después de 1.5s, nuevo drone a los 2s
            setTimeout(() => { this.stopDrone(); }, 1500);
            setTimeout(() => { this.startDrone(nextLevel); }, 2000);
        }

        // --- 8. Interfaz play() ---
        play(soundName, options = {}) {
            if (!this.started) return;
            this._resume();
            switch (soundName) {
                case 'footstep':    this._playFootstep(); break;
                case 'pickup':      this._playPickup(); break;
                case 'drop':        this._playDrop(options.scale || 1); break;
                case 'puzzle':      this._playPuzzleSolved(); break;
                case 'transition':  this._playLevelTransition(options.level || 2); break;
            }
        }
    }

    const audioEngine = new AudioEngine();

    // ------------------------------------------------------------
    //  6. COLISIONES BÁSICAS (Raycasting)
    // ------------------------------------------------------------

    const COLLISION_DISTANCE = 0.5;
    const collisionRaycaster = new THREE.Raycaster();
    const collisionMeshes = [...walls, floor];

    function canMove(direction) {
        // Lanzar rays desde múltiples alturas para detectar objetos bajos y altos
        const origins = [
            new THREE.Vector3(camera.position.x, 0.3, camera.position.z),  // rodillas
            new THREE.Vector3(camera.position.x, 0.8, camera.position.z),  // cintura
            new THREE.Vector3(camera.position.x, 1.4, camera.position.z),  // pecho
        ];
        for (const origin of origins) {
            collisionRaycaster.set(origin, direction);
            collisionRaycaster.far = COLLISION_DISTANCE;
            const hits = collisionRaycaster.intersectObjects(collisionMeshes);
            if (hits.length > 0) return false;
        }
        return true;
    }

    // ------------------------------------------------------------
    //  6. OBJETOS DE PRUEBA (Pickables)
    // ------------------------------------------------------------

    const pickableObjects = [];

    function createCube(size, color, x, y, z) {
        const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(size, size, size),
            new THREE.MeshStandardMaterial({ color, roughness: 0.5 })
        );
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        collisionMeshes.push(mesh);

        // Metadata para perspectiva forzada
        mesh.userData.isPickable = true;
        mesh.userData.originalScale = new THREE.Vector3(1, 1, 1);  // escala base = 1
        mesh.userData.baseGeometrySize = size;  // tamaño geométrico original

        pickableObjects.push(mesh);
        return mesh;
    }

    const cubeRed   = createCube(1.5, 0xe74c3c, -4, 0.75, -6);
    const cubeBlue  = createCube(1.0, 0x3498db,  3, 0.50, -3);
    const cubeGreen = createCube(2.0, 0x2ecc71,  5, 1.00,  7);

    // ------------------------------------------------------------
    //  7. SISTEMA DE PERSPECTIVA FORZADA
    // ------------------------------------------------------------

    const PICK_RANGE = 5;           // Distancia máxima para tomar un objeto
    const HOLD_DIST_DEFAULT = 3;    // Distancia de hold por defecto
    const HOLD_DIST_MIN = 2;        // Mínimo (scroll acercar)
    const HOLD_DIST_MAX = 6;        // Máximo (scroll alejar)
    const SCALE_MIN = 0.1;          // Escala mínima relativa al original
    const SCALE_MAX = 20;           // Escala máxima relativa al original
    const DROP_MAX_DISTANCE = 50;   // Distancia máxima de drop raycast
    const BOB_SPEED = 2.5;          // Velocidad del bobbing
    const BOB_AMOUNT = 0.02;        // Amplitud del bobbing
    const HIGHLIGHT_EMISSIVE = 0.15;// Intensidad emissive al hover

    const interactionRay = new THREE.Raycaster();

    let heldObject = null;          // Objeto actualmente sostenido
    let holdDistance = HOLD_DIST_DEFAULT;
    let visualSize = 0;             // Ratio tamaño_aparente = worldScale / distancia
    let holdTime = 0;               // Timer para bobbing
    let hoveredObject = null;       // Objeto bajo el crosshair
    let prevHoveredObject = null;

    // --- Detección de hover (cada frame) ---
    function updateInteractionRaycast() {
        if (heldObject) {
            // Mientras sostenemos, no hay hover
            if (hoveredObject) clearHover();
            hoveredObject = null;
            return;
        }

        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        interactionRay.set(camera.position, dir);
        interactionRay.far = PICK_RANGE;

        const hits = interactionRay.intersectObjects(pickableObjects);

        if (hits.length > 0) {
            hoveredObject = hits[0].object;
        } else {
            hoveredObject = null;
        }

        // Actualizar highlight visual
        if (hoveredObject !== prevHoveredObject) {
            if (prevHoveredObject) clearHover();
            if (hoveredObject) applyHover(hoveredObject);
            prevHoveredObject = hoveredObject;
        }

        // Actualizar crosshair
        crosshair.classList.toggle('hover', hoveredObject !== null);
    }

    function applyHover(obj) {
        obj.material.emissive = obj.material.emissive || new THREE.Color(0x000000);
        obj.userData.savedEmissive = obj.material.emissive.getHex();
        obj.material.emissiveIntensity = HIGHLIGHT_EMISSIVE;
        obj.material.emissive.set(0xffffff);
    }

    function clearHover() {
        if (!prevHoveredObject) return;
        prevHoveredObject.material.emissiveIntensity = 0;
        prevHoveredObject.material.emissive.setHex(
            prevHoveredObject.userData.savedEmissive || 0x000000
        );
    }

    // --- Tomar objeto ---
    function pickUpObject(obj) {
        // Calcular la escala del mundo actual del objeto
        const worldScale = obj.scale.x; // Asumimos escala uniforme

        // Distancia desde la cámara al objeto
        const dist = camera.position.distanceTo(obj.position);

        // Tamaño visual aparente = escala_mundo / distancia
        visualSize = worldScale / dist;

        // Remover del array de colisión mientras se sostiene
        const colIdx = collisionMeshes.indexOf(obj);
        if (colIdx !== -1) collisionMeshes.splice(colIdx, 1);

        // Quitar de la escena y pegar como hijo de la cámara
        scene.remove(obj);
        camera.add(obj);

        // Calcular escala para que se vea del mismo tamaño a holdDistance
        holdDistance = HOLD_DIST_DEFAULT;
        const holdScale = visualSize * holdDistance;
        obj.scale.set(holdScale, holdScale, holdScale);

        // Posicionar frente a la cámara en espacio local
        obj.position.set(0, 0, -holdDistance);
        obj.rotation.set(0, 0, 0);

        heldObject = obj;
        holdTime = 0;

        // Sonido pickup
        audioEngine.play('pickup');

        // Limpiar hover
        clearHover();
        hoveredObject = null;
        prevHoveredObject = null;

        // Crosshair modo "holding"
        crosshair.classList.remove('hover');
        crosshair.classList.add('holding');
    }

    // --- Soltar objeto ---
    function dropObject() {
        if (!heldObject) return;

        const obj = heldObject;
        heldObject = null;

        // Raycast desde la cámara hacia adelante para encontrar superficie
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        interactionRay.set(camera.position, dir);
        interactionRay.far = DROP_MAX_DISTANCE;

        // Intersectar con superficies del nivel + otros objetos pickables en escena
        const dropTargets = [...levelSurfaces];
        for (const p of pickableObjects) {
            if (p !== obj && p.parent === scene) dropTargets.push(p);
        }

        const hits = interactionRay.intersectObjects(dropTargets);

        let dropDist;
        let hitPoint;
        let hitNormal;

        if (hits.length > 0) {
            dropDist = hits[0].distance;
            hitPoint = hits[0].point.clone();
            hitNormal = hits[0].face.normal.clone();
            // Transformar la normal al espacio del mundo
            hitNormal.transformDirection(hits[0].object.matrixWorld);
        } else {
            // Sin intersección: soltar a distancia máxima de hold
            dropDist = holdDistance;
            hitPoint = camera.position.clone().add(dir.multiplyScalar(dropDist));
            hitNormal = new THREE.Vector3(0, 1, 0);
        }

        // Calcular nueva escala: misma proporción visual
        let newScale = visualSize * dropDist;

        // Obtener el tamaño geométrico base para calcular límites
        const baseSize = obj.userData.baseGeometrySize;

        // Aplicar límites de escala relativos al tamaño original
        newScale = Math.max(newScale, SCALE_MIN);
        newScale = Math.min(newScale, SCALE_MAX);

        // Quitar de la cámara y devolver a la escena
        camera.remove(obj);
        scene.add(obj);

        obj.scale.set(newScale, newScale, newScale);

        // La mitad del tamaño real del objeto (para apoyarlo en superficie)
        const halfHeight = (baseSize * newScale) / 2;

        // Posicionar el objeto
        obj.position.copy(hitPoint);

        // Ajustar posición para apoyar en la superficie según la normal
        // Si la normal apunta hacia arriba (piso), elevar por halfHeight
        if (hitNormal.y > 0.5) {
            obj.position.y = hitPoint.y + halfHeight;
        }
        // Si la normal apunta hacia abajo (techo), colgar
        else if (hitNormal.y < -0.5) {
            obj.position.y = hitPoint.y - halfHeight;
        }
        // Paredes: desplazar en la dirección de la normal
        else {
            obj.position.add(hitNormal.clone().multiplyScalar(halfHeight));
            // Apoyar en el piso
            obj.position.y = halfHeight;
        }

        // Resetear rotación
        obj.rotation.set(0, 0, 0);

        // Devolver al array de colisión
        collisionMeshes.push(obj);

        // Sonido drop proporcional al tamaño
        audioEngine.play('drop', { scale: newScale });

        // Crosshair modo normal
        crosshair.classList.remove('holding');

        visualSize = 0;
    }

    // --- Scroll para cambiar distancia de hold ---
    document.addEventListener('wheel', (e) => {
        if (!isLocked || !heldObject) return;

        const scrollDelta = -Math.sign(e.deltaY) * 0.3;
        holdDistance = THREE.MathUtils.clamp(
            holdDistance + scrollDelta,
            HOLD_DIST_MIN,
            HOLD_DIST_MAX
        );

        // Solo mover, NO reescalar — la perspectiva natural hace
        // que el objeto se vea más grande/pequeño al acercar/alejar
    });

    // --- Actualizar objeto sostenido (bobbing) ---
    function updateHeldObject(dt) {
        if (!heldObject) return;

        holdTime += dt;

        // Bobbing sutil
        const bob = Math.sin(holdTime * BOB_SPEED) * BOB_AMOUNT;
        heldObject.position.set(0, bob, -holdDistance);
    }

    // --- Input: Click para tomar/soltar ---
    document.addEventListener('mousedown', (e) => {
        if (!isLocked) {
            document.body.requestPointerLock();
            return;
        }

        if (e.button === 0) { // Click izquierdo
            if (heldObject) {
                dropObject();
            } else if (hoveredObject) {
                pickUpObject(hoveredObject);
            }
        } else if (e.button === 2) { // Click derecho
            if (heldObject) {
                dropObject();
            }
        }
    });

    // Prevenir menú contextual
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // ------------------------------------------------------------
    //  8. GAME LOOP
    // ------------------------------------------------------------

    let prevTime = performance.now();

    function update(dt) {
        if (!isLocked) return;

        // --- Movimiento del jugador ---
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        const right = new THREE.Vector3();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

        const moveDir = new THREE.Vector3();

        if (keys['KeyW'] || keys['ArrowUp'])    moveDir.add(forward);
        if (keys['KeyS'] || keys['ArrowDown'])   moveDir.sub(forward);
        if (keys['KeyA'] || keys['ArrowLeft'])   moveDir.sub(right);
        if (keys['KeyD'] || keys['ArrowRight'])  moveDir.add(right);

        if (moveDir.lengthSq() > 0) {
            moveDir.normalize();
            const velocity = moveDir.multiplyScalar(MOVE_SPEED * dt);

            const dirX = new THREE.Vector3(Math.sign(velocity.x), 0, 0);
            if (velocity.x !== 0 && canMove(dirX)) {
                camera.position.x += velocity.x;
            }

            const dirZ = new THREE.Vector3(0, 0, Math.sign(velocity.z));
            if (velocity.z !== 0 && canMove(dirZ)) {
                camera.position.z += velocity.z;
            }
        }

        camera.position.y = PLAYER_HEIGHT;

        // --- Audio: pasos ---
        const isMoving = moveDir.lengthSq() > 0;
        audioEngine.updateFootsteps(isMoving, dt);

        // --- Sistemas de interacción ---
        updateInteractionRaycast();
        updateHeldObject(dt);
    }

    function gameLoop() {
        requestAnimationFrame(gameLoop);

        const now = performance.now();
        const dt = (now - prevTime) / 1000;
        prevTime = now;

        update(dt);
        renderer.render(scene, camera);
    }

    gameLoop();

    </script>
</body>
</html>
